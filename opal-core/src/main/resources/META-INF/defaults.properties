# JDBC
org.obiba.opal.jdbc.maxPoolSize=300

# Storage safeguards
# How often the open H2 databases are forced to physical disk, in milliseconds. Nothing else does it while Opal runs:
# H2 writes pages in the background but never syncs the file, so a power loss costs everything written since the last
# checkpoint. Set to 0 or less to disable.
org.obiba.opal.storage.checkpoint.interval=300000
# How often the free space of the volumes Opal writes to is sampled, in milliseconds. Set to 0 or less to disable.
org.obiba.opal.storage.disk.interval=60000
# Whether the levels below are acted upon. When false the readings are still taken and reported in /system/status, and
# nothing is refused: the thresholds can be observed against a real deployment before they start failing jobs.
org.obiba.opal.storage.disk.enforce=false
# Each level is reached when the free space falls under the number of bytes. The thresholds are absolute and not a
# share of the volume: what has to fit is an import, a compaction or a clean close, and none of those needs more room
# on a larger disk. A deployment whose imports are much bigger than usual raises warn.bytes.
# WARN: reported, nothing is refused.
org.obiba.opal.storage.disk.warn.bytes=5368709120
# DEGRADED: imports, copies, backups, restores and uploads are refused. Reads, login and configuration writes keep
# working, which is what leaves a way in to make room.
org.obiba.opal.storage.disk.degraded.bytes=2147483648
# CRITICAL: running tasks are cancelled too. A cancelled import can be run again; a database that hits a full disk
# closes itself without persisting and costs a restart.
org.obiba.opal.storage.disk.critical.bytes=536870912
# How much more room than its announced size an upload is asked to leave.
org.obiba.opal.storage.disk.upload.safetyFactor=1.2

# Configuration database
# Empty means the embedded H2 database in ${OPAL_HOME}/data/config, opened as user 'opal' with the
# <databasePassword> that Opal generates in ${OPAL_HOME}/data/opal-config.xml.
# Point these at an external server to keep the configuration there instead, for instance:
#   org.obiba.opal.config.datasource.url=jdbc:postgresql://localhost:5432/opal_config
#   org.obiba.opal.config.datasource.driverClass=org.postgresql.Driver
#   org.obiba.opal.config.datasource.username=opal
#   org.obiba.opal.config.datasource.password=secret
# An external database needs a password here: only the embedded one uses the generated password.
org.obiba.opal.config.datasource.url=
org.obiba.opal.config.datasource.driverClass=
org.obiba.opal.config.datasource.username=
org.obiba.opal.config.datasource.password=
org.obiba.opal.config.hibernate.dialect=

# Security
# user can login from different realms
org.obiba.opal.security.multiProfile=true

# App registration
apps.registration.token=
apps.registration.include=
apps.registration.exclude=
# discovery scheduling in milliseconds
apps.discovery.interval = 10000

# CSRF
# allowed referrers, comma separated <host:port>
csrf.allowed=
# allowed user agents when referrer is not specified
csrf.allowed-agents=curl,python,java,HTTP.jl

# CORS
# use * as wildcard, separate origins with commas
cors.allowed=

# Files
# white list of file extensions
files.extensions.allowed=*
# black list of file extensions
files.extensions.denied=exe,sh

# Kubernetes
# list of allowed rock type images that can be declared in pod specifications
pods.rock.images.allowed=
# maximum number of time pod creation check attempts
pods.maxAttempts=300
# delay in millis between pod creation check attempts
pods.delay=1000
# maximum number of running check attempts when a new rock pod is started
pods.rock.running.maxAttempts=300
# delay in millis between rock pod running check attempts
pods.rock.running.delay=1000
# maximum number of connection attempts when a new rock pod is started
pods.rock.connection.maxAttempts=300
# delay in millis between rock pod connection attempts
pods.rock.connection.delay=1000
# default rock pod specification
pods.rock.specs=[{"id": "default","type": "rock","container": {"name": "default","image": "obiba/rock:latest","imagePullPolicy": "IfNotPresent","port": 8085,"resources": {"requests": {"cpu": "1000m","memory": "500Mi"},"limits": {"cpu": "1000m","memory": "1Gi"}}},"enabled": true}]
